<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend/Backend Separated Calculator - 832401225</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="layout">
      <!-- Calculator panel: input and result display; all calculation is done by the backend -->
      <section class="card calculator" aria-label="Calculator">
        <header class="calc-header">
          <h1>Calculator</h1>
          <div class="header-actions">
            <span id="api-status" class="api-status">
              <i class="dot"></i><span id="api-status-text">Checking backend…</span>
            </span>
            <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme">🌙</button>
          </div>
        </header>

        <div class="display">
          <div id="expression" class="expression">0</div>
          <div id="result" class="result"></div>
        </div>

        <div class="keypad" id="keypad">
          <button class="key function" type="button" data-action="clear">C</button>
          <button class="key function" type="button" data-insert="(">(</button>
          <button class="key function" type="button" data-insert=")">)</button>
          <button class="key function" type="button" data-action="backspace">⌫</button>

          <button class="key" type="button" data-insert="7">7</button>
          <button class="key" type="button" data-insert="8">8</button>
          <button class="key" type="button" data-insert="9">9</button>
          <button class="key operator" type="button" data-insert="/">÷</button>

          <button class="key" type="button" data-insert="4">4</button>
          <button class="key" type="button" data-insert="5">5</button>
          <button class="key" type="button" data-insert="6">6</button>
          <button class="key operator" type="button" data-insert="*">×</button>

          <button class="key" type="button" data-insert="1">1</button>
          <button class="key" type="button" data-insert="2">2</button>
          <button class="key" type="button" data-insert="3">3</button>
          <button class="key operator" type="button" data-insert="-">−</button>

          <button class="key" type="button" data-insert="0">0</button>
          <button class="key" type="button" data-insert=".">.</button>
          <button class="key operator" type="button" data-insert="+">+</button>
          <button class="key equals" type="button" data-action="equals">=</button>
        </div>

        <footer class="calc-footer">
          Keyboard supported: digits and operators, Enter to evaluate, Backspace to delete, Esc to clear
        </footer>
      </section>

      <!-- History panel: all data comes from the backend database -->
      <aside class="card history" aria-label="History">
        <header class="history-header">
          <h2>History</h2>
          <button id="clear-history" class="text-btn danger" type="button">Clear all</button>
        </header>
        <p class="history-source">Data comes from the backend database and survives page refreshes</p>
        <ul id="history-list" class="history-list"></ul>
      </aside>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
